<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExampleKart Troubleshooting Agent</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#66707d; --line:#e2e6ec; --brand:#0069ff;
          --ok:#0f9d58; --warn:#b26a00; --bad:#d93025; --chip:#eef2f8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1a2028; --text:#e8ecf1; --muted:#95a0ae; --line:#2a323d; --brand:#4d94ff;
            --ok:#3ddc84; --warn:#f2a93b; --bad:#ff6b5e; --chip:#252d38; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); background:var(--card); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; } header span { color:var(--muted); font-size:13px; }
  main { max-width:1180px; margin:0 auto; padding:20px 24px 60px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; }
  input[type=text] { flex:1; min-width:220px; padding:11px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font-size:15px; }
  button { padding:11px 20px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:var(--chip); color:var(--text); }
  .grid { display:grid; grid-template-columns: 5fr 7fr; gap:18px; margin-top:18px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px; }
  .step { padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .step:last-child { border-bottom:0; }
  .step b { font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .step .sub { color:var(--muted); font-size:12.5px; word-break:break-word; }
  .note { padding:6px 10px; margin:6px 0; border-left:3px solid var(--brand); color:var(--muted); font-size:13px; font-style:italic; }
  .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12.5px; font-weight:700; color:#fff; }
  .b-resolve { background:var(--ok); } .b-insufficient_evidence { background:var(--warn); }
  .b-not_our_problem { background:#6b7280; } .b-unstructured { background:#6b7280; }
  .kv { display:grid; grid-template-columns:150px 1fr; gap:6px 12px; margin:12px 0; }
  .kv div:nth-child(odd) { color:var(--muted); font-size:13px; }
  .chip { display:inline-block; background:var(--chip); border-radius:6px; padding:2px 8px; margin:2px 4px 2px 0; font:12.5px ui-monospace,Menlo,monospace; }
  .chip.bad { background:transparent; border:1px solid var(--bad); color:var(--bad); }
  h3 { font-size:13px; color:var(--muted); margin:16px 0 4px; text-transform:uppercase; letter-spacing:.05em; }
  ol, ul { margin:4px 0 0 18px; padding:0; } li { margin:2px 0; }
  .pre { white-space:pre-wrap; }
  .err { color:var(--bad); font-weight:600; margin-top:10px; }
  .muted { color:var(--muted); font-size:13px; }
  .qa { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
  .qa .q { font-weight:600; }
  .spinner { display:inline-block; width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:sp 1s linear infinite; vertical-align:-1px; margin-right:6px; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>ExampleKart Troubleshooting Agent</h1>
  <span>Enter a case ID. The agent pulls alerts, changes, metrics, logs and traces, then explains the root cause.</span>
</header>
<main>
  <div class="bar">
    <input id="caseId" type="text" list="caseList" placeholder="Case ID, e.g. CASE-001" autocomplete="off">
    <datalist id="caseList"></datalist>
    <button id="go">Investigate</button>
  </div>
  <div id="msg" class="err"></div>

  <div class="grid" id="grid" hidden>
    <section class="card">
      <h2 id="stepsTitle">Investigation steps</h2>
      <div id="steps"></div>
    </section>
    <section class="card">
      <h2>Diagnosis</h2>
      <div id="result"><span class="muted"><span class="spinner"></span>Working...</span></div>
      <div id="qa"></div>
      <div class="bar" id="askBar" style="margin-top:14px" hidden>
        <input id="question" type="text" placeholder="Ask a follow-up, e.g. Could the gateway deploy have caused this?">
        <button id="ask" class="ghost">Ask</button>
      </div>
      <div id="metrics" class="muted" style="margin-top:14px"></div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let jobId = null, next = 0, timer = null, shownAnswers = 0;

async function api(path, opts) {
  const r = await fetch(path, opts);
  let body = null; try { body = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((body && body.detail) || ('HTTP ' + r.status));
  return body;
}

// populate suggestions
api('/api/cases').then(list => {
  if (!Array.isArray(list)) return;
  $('caseList').innerHTML = list.map(c => {
    const id = c.id || c.case_id; if (!id) return '';
    return `<option value="${esc(id)}">${esc(c.title || c.summary || c.description || '')}</option>`;
  }).join('');
}).catch(() => {});

$('go').onclick = async () => {
  const id = $('caseId').value.trim();
  if (!id) return;
  $('msg').textContent = ''; $('go').disabled = true;
  try {
    const j = await api('/api/investigations', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({case_id:id})});
    jobId = j.id; next = 0; shownAnswers = 0;
    $('grid').hidden = false; $('steps').innerHTML = ''; $('qa').innerHTML = ''; $('metrics').textContent = '';
    $('askBar').hidden = true;
    $('result').innerHTML = '<span class="muted"><span class="spinner"></span>Working...</span>';
    poll();
  } catch (e) { $('msg').textContent = e.message; $('go').disabled = false; }
};
$('caseId').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

$('ask').onclick = async () => {
  const q = $('question').value.trim(); if (!q) return;
  $('ask').disabled = true; $('msg').textContent = '';
  try {
    await api(`/api/investigations/${jobId}/ask`, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({question:q})});
    $('question').value = '';
    $('qa').insertAdjacentHTML('beforeend', `<div class="qa" id="pending"><div class="q">${esc(q)}</div><div class="muted"><span class="spinner"></span>Thinking...</div></div>`);
    poll();
  } catch (e) { $('msg').textContent = e.message; $('ask').disabled = false; }
};
$('question').addEventListener('keydown', e => { if (e.key === 'Enter') $('ask').click(); });

function poll() {
  clearTimeout(timer);
  api(`/api/investigations/${jobId}?since=${next}`).then(v => {
    renderSteps(v.steps); next = v.next;
    if (v.status === 'running') { timer = setTimeout(poll, 1200); return; }
    $('go').disabled = false; $('ask').disabled = false;
    if (v.status === 'error') { $('result').innerHTML = `<div class="err">${esc(v.error)}</div>`; return; }
    renderResult(v.result); renderAnswers(v.answers); renderMetrics(v.metrics);
    $('askBar').hidden = false;
  }).catch(e => { $('msg').textContent = e.message; $('go').disabled = false; $('ask').disabled = false; });
}

function renderSteps(steps) {
  const box = $('steps');
  for (const s of steps) {
    if (s.type === 'note') { box.insertAdjacentHTML('beforeend', `<div class="note">${esc(s.text)}</div>`); continue; }
    const a = Object.entries(s.args || {}).map(([k, v]) => `${k}=${typeof v === 'string' ? v : JSON.stringify(v)}`).join('  ');
    box.insertAdjacentHTML('beforeend',
      `<div class="step"><b>${s.n}. ${esc(s.tool)}</b> <span class="muted">${s.ms} ms</span>` +
      `<div class="sub">${esc(a)}</div><div class="sub">&rarr; ${esc(s.summary)}</div></div>`);
  }
  box.scrollTop = box.scrollHeight;
}

function list(items, tag) {
  if (!items || !items.length) return '<span class="muted">none</span>';
  return `<${tag}>${items.map(i => `<li>${esc(i)}</li>`).join('')}</${tag}>`;
}

function renderResult(d) {
  if (!d) return;
  const bad = new Set(d.unverified_ids || []);
  const chips = (d.evidence || []).map(e => `<span class="chip ${bad.has(e) ? 'bad' : ''}" title="${bad.has(e) ? 'Not found in any tool result' : ''}">${esc(e)}${bad.has(e) ? ' ?' : ''}</span>`).join('') || '<span class="muted">none</span>';
  $('result').innerHTML = `
    <span class="badge b-${esc(d.verdict)}">${esc((d.verdict || '').replace(/_/g, ' '))}</span>
    <div class="kv">
      <div>Root cause service</div><div><b>${esc(d.root_cause_service)}</b></div>
      <div>Category</div><div>${esc((d.root_cause_category || '').replace(/_/g, ' '))}</div>
      <div>Confidence</div><div>${esc(d.confidence || 'n/a')}</div>
    </div>
    <h3>Explanation</h3><div class="pre">${esc(d.explanation)}</div>
    <h3>Timeline</h3>${list(d.timeline, 'ol')}
    <h3>Evidence</h3><div>${chips}</div>
    ${bad.size ? '<div class="muted">Red chips were cited by the model but never returned by a tool. Treat them as unverified.</div>' : ''}
    <h3>Ruled out</h3>${list(d.decoys_ruled_out, 'ul')}
    <h3>Recommended action</h3><div class="pre">${esc(d.recommended_action)}</div>`;
}

function renderAnswers(answers) {
  if (!answers || answers.length === shownAnswers) return;
  const p = $('pending'); if (p) p.remove();
  for (const a of answers.slice(shownAnswers))
    $('qa').insertAdjacentHTML('beforeend', `<div class="qa"><div class="q">${esc(a.q)}</div><div class="pre">${esc(a.a)}</div></div>`);
  shownAnswers = answers.length;
}

function renderMetrics(m) {
  if (!m || !m.llm_calls) return;
  $('metrics').textContent = `${m.model} | ${m.elapsed_s}s total | ${m.llm_calls} model calls | ${m.tool_calls} tool calls | ${m.api_requests} dataset requests | ${m.in_tok} in / ${m.out_tok} out tokens`;
}
</script>
</body>
</html>

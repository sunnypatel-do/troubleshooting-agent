<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExampleKart Troubleshooting Bot</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#22304d;--text:#e6ecf7;--muted:#8a99b8;--accent:#0069ff;--ok:#2fbf71;--warn:#f5a623;--err:#ff5c5c;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;height:100vh;display:grid;grid-template-columns:340px 1fr;grid-template-rows:56px 1fr}
  header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:600}
  header .pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-family:var(--mono)}
  aside{border-right:1px solid var(--line);overflow-y:auto;background:var(--panel)}
  aside h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 16px 6px}
  .case{padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .case.all{background:#0f1a33;border-bottom:1px solid var(--line)}
  .case:hover{background:#16213a}.case.active{background:#182848;border-left:3px solid var(--accent)}
  .case b{font-family:var(--mono);font-size:12px}.case .area{float:right;font-size:11px;color:var(--muted)}
  .case p{margin:4px 0 0;color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  main{display:flex;flex-direction:column;min-width:0}
  #casebox{padding:12px 20px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
  #casebox b{color:var(--text)}
  #chat{flex:1;overflow-y:auto;padding:20px}
  .msg{max-width:860px;margin:0 auto 16px}
  .msg .who{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
  .user .body{background:#182848;border-radius:10px;padding:10px 14px;display:inline-block}
  .bot .body{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
  .body h1,.body h2,.body h3{font-size:14px;margin:12px 0 4px}.body ul{padding-left:20px;margin:4px 0}.body p{margin:6px 0}
  .body code{font-family:var(--mono);font-size:12px;background:#0b1220;padding:1px 5px;border-radius:4px}
  .body pre{background:#0b1220;padding:10px;border-radius:8px;overflow-x:auto;font-size:12px}
  .trail{margin:0 0 8px;border-left:2px solid var(--line);padding-left:10px}
  .step{font-family:var(--mono);font-size:12px;color:var(--muted);margin:3px 0}
  .step .n{color:var(--accent)} .step .r{color:var(--ok)} .step.err{color:var(--err)}
  .step details{display:inline}.step summary{cursor:pointer;display:inline;color:var(--muted)}
  .step pre{white-space:pre-wrap;word-break:break-all;max-height:160px;overflow:auto;margin:4px 0;color:#b7c3dd}
  form{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--panel)}
  textarea{flex:1;resize:none;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;height:48px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:0 18px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 10px}
  .chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);cursor:pointer;background:transparent}
  .chip:hover{border-color:var(--accent);color:var(--text)}
  .spin{display:inline-block;width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:middle}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>ExampleKart Troubleshooting Bot</h1>
  <span class="pill" id="modelpill">model: …</span>
  <span class="pill">DigitalOcean Serverless Inference · agentic tool-calling</span>
</header>
<aside>
  <h2>Mode</h2>
  <div class="case all" data-id="ALL"><b>🔎 All cases — auto-detect</b><p>Ask anything; the bot searches all 20 requests, matches the case(s), then investigates.</p></div>
  <h2>Or pick one case (20)</h2>
  <div id="cases"></div>
</aside>
<main>
  <div id="casebox">Select a case on the left.</div>
  <div id="chat"></div>
  <div class="chips" id="chips"></div>
  <form id="f">
    <textarea id="q" placeholder="Ask about this case… e.g. What is the root cause? Was the customer charged twice? Who should we escalate to?"></textarea>
    <button id="send" type="submit">Investigate</button>
  </form>
</main>

<script>
const SUGGESTED_ALL = [
  "my card got charged twice and i never got an order confirmation email. what happened?",
  "Customers say the home goods category just spins but other categories work. Which case is this and what is the root cause?",
  "Which incidents involved Kafka consumer lag, and were they related?",
  "List every case where a deploy happened in the window and say whether the deploy was to blame.",
  "Which cases were caused by infrastructure (lb, postgres, valkey, cdn) rather than application code?",
  "A UK customer cannot get past the address form. Find the case and explain the fix."
];
const SUGGESTED = [
  "What is the root cause? Give me the full investigation.",
  "What changed in the window (deploys, config, migrations) and is any change to blame?",
  "Walk me through one failing trace end to end.",
  "Is there a runbook or postmortem for this? Is it still current?",
  "Which team should we escalate to and what should the mitigation be?",
  "Draft a reply to the customer explaining what happened."
];
let cases = [], current = null, history = [], busy = false;
const $ = s => document.querySelector(s);

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
// Tiny markdown renderer (headings, bold, code, lists, paragraphs) — no external deps.
function md(src){
  src = esc(src);
  src = src.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre>${c.trim()}</pre>`);
  src = src.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  src = src.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  src = src.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  src = src.replace(/(?:^|\n)((?:[-*] .*(?:\n|$))+)/g,(m,l)=>'\n<ul>'+l.trim().split('\n').map(x=>'<li>'+x.replace(/^[-*] /,'')+'</li>').join('')+'</ul>\n');
  src = src.replace(/(?:^|\n)((?:\d+\. .*(?:\n|$))+)/g,(m,l)=>'\n<ol>'+l.trim().split('\n').map(x=>'<li>'+x.replace(/^\d+\. /,'')+'</li>').join('')+'</ol>\n');
  return src.split(/\n{2,}/).map(p=>/^<(h\d|ul|ol|pre)/.test(p.trim())?p:`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
}

async function load(){
  const h = await fetch('/healthz').then(r=>r.json());
  $('#modelpill').textContent = 'model: '+h.model + (h.inference_key_set?'':'  ⚠ no DO_MODEL_ACCESS_KEY');
  cases = (await fetch('/api/cases').then(r=>r.json())).data;
  $('#cases').innerHTML = cases.map(c=>`<div class="case" data-id="${c.case_id}"><b>${c.case_id}</b><span class="area">${c.affected_area}</span><p>${esc(c.description)}</p></div>`).join('');
  document.querySelectorAll('.case').forEach(el=>el.onclick=()=>select(el.dataset.id));
  select((location.hash||'#ALL').slice(1));
}
function chips(list){
  $('#chips').innerHTML = list.map(s=>`<button type="button" class="chip">${esc(s)}</button>`).join('');
  document.querySelectorAll('.chip').forEach((el,i)=>el.onclick=()=>{$('#q').value=list[i];$('#q').focus()});
}
function select(id){
  history = []; $('#chat').innerHTML='';
  document.querySelectorAll('.case').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  if(id==='ALL'){
    current = {case_id:null}; location.hash='ALL'; chips(SUGGESTED_ALL);
    $('#casebox').innerHTML = `<b>All cases — auto-detect.</b> Paste a customer complaint, describe symptoms, name a CASE-0NN, or ask a question that spans several cases. The bot will call <code>find_cases</code> / <code>list_cases</code> / <code>search_*_all_cases</code> first, tell you which case it matched, then investigate.`;
    $('#q').placeholder='e.g. "my card got charged twice and i never got a confirmation email" or "which cases involved Kafka lag?"';
    return;
  }
  current = cases.find(c=>c.case_id===id); if(!current) return;
  location.hash = id; chips(SUGGESTED);
  $('#q').placeholder='Ask about this case… e.g. What is the root cause? Who should we escalate to?';
  $('#casebox').innerHTML = `<b>${current.case_id}</b> · opened ${current.created_at} · window ${current.window.from} → ${current.window.to} · tagged <b>${current.affected_area}</b>`+
    (current.error_message?` · error <code>${esc(current.error_message)}</code>`:'')+`<br>“${esc(current.description)}”`;
}
function add(cls, who, html){
  const d=document.createElement('div'); d.className='msg '+cls;
  d.innerHTML=`<div class="who">${who}</div>${html}`; $('#chat').appendChild(d); $('#chat').scrollTop=1e9; return d;
}

$('#f').onsubmit = async e => {
  e.preventDefault(); if(busy||!current) return;
  const q = $('#q').value.trim(); if(!q) return;
  $('#q').value=''; busy=true; $('#send').disabled=true;
  add('user','You',`<div class="body">${esc(q)}</div>`);
  const bot = add('bot','Bot',`<div class="trail"></div><div class="body"><span class="spin"></span> investigating…</div>`);
  const trail = bot.querySelector('.trail'), body = bot.querySelector('.body');
  let answer = '';
  try{
    const res = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:current.case_id,message:q,history})});
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf='';
    while(true){
      const {value,done} = await rd.read(); if(done) break;
      buf += dec.decode(value,{stream:true});
      let i; while((i=buf.indexOf('\n\n'))>=0){
        const line = buf.slice(0,i).trim(); buf = buf.slice(i+2);
        if(!line.startsWith('data:')) continue;
        const ev = JSON.parse(line.slice(5));
        if(ev.type==='tool_call'){
          const s=document.createElement('div'); s.className='step';
          s.innerHTML=`<span class="n">▸ ${ev.name}</span>(${esc(JSON.stringify(ev.args))}) <span class="spin"></span>`; trail.appendChild(s);
        } else if(ev.type==='tool_result'){
          const s=trail.lastElementChild; if(s){ s.querySelector('.spin')?.remove();
            s.insertAdjacentHTML('beforeend',` <span class="r">✓ ${ev.chars} chars</span> <details><summary>peek</summary><pre>${esc(ev.preview)}…</pre></details>`);}
        } else if(ev.type==='answer'){ answer=ev.content; body.innerHTML=md(answer); }
        else if(ev.type==='error'){ body.innerHTML=`<span style="color:var(--err)">${esc(ev.message)}</span>`; }
        $('#chat').scrollTop=1e9;
      }
    }
  }catch(err){ body.innerHTML=`<span style="color:var(--err)">${esc(String(err))}</span>`; }
  if(answer){ history.push({role:'user',content:q},{role:'assistant',content:answer}); }
  busy=false; $('#send').disabled=false;
};
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#f').requestSubmit();} });
load();
</script>
</body>
</html>
